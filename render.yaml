services:
  - type: web
    name: agroeco-formation
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: agroeco-formation-db
          property: connectionString
databases:
  - name: agroeco-formation-db
    plan: free
