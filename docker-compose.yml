services:
  web:
    build: .
    ports:
      - "5001:5000"
    environment:
      - SECRET_KEY=change-moi-en-production
      - DATABASE_URL=postgresql://agroeco:agroeco@db:5432/agroeco_formation
      - ADMIN_PASSWORD=agroeco2026
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agroeco
      - POSTGRES_PASSWORD=agroeco
      - POSTGRES_DB=agroeco_formation
    volumes:
      - agroeco_pgdata:/var/lib/postgresql/data
volumes:
  agroeco_pgdata:
