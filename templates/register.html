{% extends "base.html" %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-course p-4">
      <h3 class="mb-3 text-center">🌱 {{ cabinet_name }}</h3>
      <p class="text-center text-muted">Créer votre compte étudiant</p>
      <form method="POST">
        <div class="mb-2">
          <label class="form-label">Nom complet</label>
          <input type="text" name="full_name" class="form-control" required autofocus>
        </div>
        <div class="mb-2">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Téléphone</label>
          <input type="text" name="phone" class="form-control" placeholder="ex: 77 123 45 67">
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required minlength="6">
          </div>
          <div class="col-6 mb-3">
            <label class="form-label">Confirmer</label>
            <input type="password" name="password2" class="form-control" required minlength="6">
          </div>
        </div>
        <button type="submit" class="btn btn-success w-100">Créer mon compte</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0">
        Déjà un compte ? <a href="{{ url_for('login') }}">Se connecter</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
